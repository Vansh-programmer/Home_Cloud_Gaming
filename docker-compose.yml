version: "3.8"

services:
  # ============================================================================
  # 1. WOLF // CLOUD GAMING STREAMING SERVER & ORCHESTRATOR
  # ============================================================================
  # Headless GameStream daemon that manages isolated container lifecycles.
  # Spawns Steam and Heroic in virtual Sway/Gamescope compositors on demand.
  # ============================================================================
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: ryoku-cloud-server
    restart: unless-stopped
    network_mode: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_VOLUME_NAME=nvidia-driver-vol
      - WOLF_LOG_LEVEL=INFO
    volumes:
      - ./wolf/config:/etc/wolf:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      - nvidia-driver-vol:/usr/nvidia:rw
      # Shared Games Library: Mounted Read-Only into container instances
      - ./data/shared_games:/shared_games:ro
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
      - /dev/nvidiactl
      - /dev/nvidia0
      - /dev/nvidia-modeset
    device_cgroup_rules:
      - 'c 13:* rmw'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================================
  # 2. MOONLIGHT WEB // IN-BROWSER STREAMING CLIENT (WEBCODECS + WASM)
  # ============================================================================
  # Allows any remote user to stream games directly from Chrome/Edge/Safari.
  # Hardware-accelerated video decoding, Pointer Lock, and HTML5 Gamepad API.
  # ============================================================================
  moonlight-web:
    image: ghcr.io/linckosz/moonlight-web:latest
    container_name: ryoku-moonlight-web
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - MW_HTTP_PORT=8080
      - MW_HTTPS_PORT=8443
      - MW_UPNP=0
    volumes:
      - mw-data:/data

volumes:
  # Host NVIDIA driver volume (shared across all game containers)
  nvidia-driver-vol:
    external: true
  # Moonlight Web persistent pairing & settings
  mw-data:
    name: ryoku-mw-data
  # Per-user isolated cloud gaming state (saves, credentials, Proton prefixes)
  user-storage:
    name: ryoku-user-storage
