services:
  # ============================================================================
  # 1. WOLF // CLOUD GAMING STREAMING SERVER & ORCHESTRATOR
  # ============================================================================
  # Modern Games on Whales GameStream engine with native NVIDIA Container Toolkit.
  # Spawns isolated game containers (Steam / Heroic) on demand.
  # ============================================================================
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: ryoku-cloud-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      wolf-config:
        condition: service_completed_successfully
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - WOLF_LOG_LEVEL=INFO
      - WOLF_USE_ZERO_COPY=FALSE
      - WOLF_RENDER_NODE=/dev/dri/renderD128
      - WOLF_ENCODER_NODE=/dev/dri/renderD128
      - WOLF_WAYLAND_SOCKET_WAIT_TIMEOUT_MS=10000
      - HOST_APPS_STATE_FOLDER=/var/lib/ryoku-user-storage
    volumes:
      - ./wolf/config:/etc/wolf:rw
      - user-storage:/var/lib/ryoku-user-storage:rw
      - wolf-runtime:/run/user/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      - ./data/shared_games:/shared_games:ro
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
    device_cgroup_rules:
      - 'c 13:* rmw'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]

  # Wolf derives its config path from HOST_APPS_STATE_FOLDER. Seed the existing
  # repository config and paired identity into that volume before Wolf starts.
  wolf-config:
    build:
      context: ./deploy/wolf-config
    container_name: ryoku-wolf-config
    restart: "no"
    volumes:
      - ./wolf/config/cfg:/source:ro
      - user-storage:/data

  # ============================================================================
  # 2. MOONLIGHT WEB // IN-BROWSER STREAMING CLIENT (WEBCODECS + WASM)
  # ============================================================================
  # In-browser WebCodecs streaming interface on port 8080.
  # ============================================================================
  moonlight-web:
    image: ghcr.io/linckosz/moonlight-web:latest
    container_name: ryoku-moonlight-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      access-gate:
        condition: service_healthy
      moonlight-config:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - MW_HTTP_PORT=8080
      - MW_HTTPS_PORT=8443
      - MW_UPNP=1
      # Do not expose MoonlightWeb's separate public entry link; browser access
      # must pass through the local player-account gate.
      - MW_RENDEZVOUS_URL=https://rendezvous-disabled.invalid
    volumes:
      - mw-data:/data

  # Keep MoonlightWeb on the player custom hostname across clean
  # installs and container rebuilds, without replacing its generated secrets.
  moonlight-config:
    build:
      context: ./deploy/moonlight-config
    container_name: ryoku-moonlight-config
    restart: "no"
    volumes:
      - mw-data:/data

  # Stores local username/password accounts and validates player sessions.
  # Accounts and session state persist in the access-state volume.
  access-gate:
    build:
      context: ./deploy/access-gate
    container_name: ryoku-access-gate
    restart: unless-stopped
    network_mode: host
    environment:
      - WOLF_WEB_CLIENT_ID=${WOLF_WEB_CLIENT_ID:-14944261881562049900}
      - WOLF_APP_STATE_FOLDER=/var/lib/ryoku-user-storage
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      # The named volume root is owned by Wolf's UID; the gate creates account homes beneath it.
      - DAC_OVERRIDE
      - FOWNER
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - wolf-runtime:/run/user/wolf:ro
      - access-state:/var/lib/ryoku-access
      - mw-data:/run/moonlight:ro
      - user-storage:/var/lib/ryoku-user-storage:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. GATEWAY // CADDY EDGE REVERSE PROXY & AUTOMATED SSL (vanshdev.online)
  # ============================================================================
  # Serves the clean web portal on port 80/443 and reverse proxies WebCodecs streams
  # ============================================================================
  gateway:
    image: caddy:alpine
    container_name: ryoku-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      access-gate:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/usr/share/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mw-data:
    name: ryoku-mw-data
  wolf-runtime:
    name: ryoku-wolf-runtime
  access-state:
    name: ryoku-access-state
  # Wolf stores one isolated home per local player account beneath its app-state root.
  user-storage:
    name: ryoku-user-storage
    external: true
  caddy-data:
    name: ryoku-caddy-data
  caddy-config:
    name: ryoku-caddy-config
