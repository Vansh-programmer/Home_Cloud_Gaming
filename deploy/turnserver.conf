# Ryoku Cloud Gaming — coturn STUN/TURN Server Configuration (Phase 6)
#
# Provides low-latency UDP media traversal when playing outside your home Wi-Fi
# (e.g., over 5G mobile data or strict corporate/college NATs).
#
# Usage on CachyOS / Arch Linux:
#   sudo pacman -S coturn
#   turnserver -c deploy/turnserver.conf
#
# Make sure the `static-auth-secret` matches `TURN_SECRET` in Ryoku Cloud Gaming
# (or configure it directly in the Admin Dashboard -> External Access & TURN panel).

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=replace-with-your-ryoku-turn-hmac-secret
realm=ryoku.local

# UDP relay port range for WebRTC H.264 video + Opus audio + RTCDataChannel
min-port=49152
max-port=49252

# Security hardening: block relay access to loopback and private LAN ranges
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

