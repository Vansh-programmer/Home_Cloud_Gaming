]
env = [
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
