hostname = "Ryoku Cloud Gaming"
support_hevc = true

# ==============================================================================
# APPLICATION 1: STEAM CLOUD GAMING NODE
# ==============================================================================
# Isolated Steam container running on a virtual headless compositor (Sway/Gamescope).
# Fresh, independent cloud storage (zero host Steam or host filesystem coupling).
# When the user connects via Moonlight, it boots directly into Steam Big Picture.
# ==============================================================================
[[apps]]
title = "Steam Cloud Gaming"
start_virtual_compositor = true

[apps.runner]
type = "docker"
name = "steam-cloud"
image = "ghcr.io/games-on-whales/steam:edge"
mounts = [
    "ryoku-cloud-storage:/home/retro:rw"
]
env = [
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*",
    "ENABLE_VKBASALT=0"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
      "c 13:* rmw"
    ]
  }
}
"""

# ==============================================================================
# APPLICATION 2: RETROARCH CLOUD GAMING (INSTANT PLAY)
# ==============================================================================
# Plug-and-play cloud arcade & retro gaming without requiring any account login.
# ==============================================================================
[[apps]]
title = "RetroArch Cloud Arcade"
start_virtual_compositor = true

[apps.runner]
