hostname = "Ryoku Cloud Gaming"
support_hevc = true

# ==============================================================================
# APPLICATION 1: STEAM CLOUD GAMING NODE
# ==============================================================================
# - Runs on headless virtual Sway/Gamescope compositor.
# - Shared Games: Mounted READ-ONLY at /shared_games inside game containers.
# - User Profile: Wolf's per-client home stays writable for installs, logins, saves, and prefixes.
# ==============================================================================
[[apps]]
title = "Steam Cloud Gaming"
start_virtual_compositor = true

[apps.runner]
type = "docker"
name = "steam-cloud"
image = "ghcr.io/games-on-whales/steam:edge"
mounts = [
    # Wolf supplies a separate writable home directory for each paired client.
    # Shared Game Library (READ-ONLY; each user's default Steam library remains writable)
    "/home/vansh/Projects/Home_Cloud_Gaming/data/shared_games:/shared_games:ro"
]
env = [
    "XDG_RUNTIME_DIR=/tmp",
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*",
    "ENABLE_VKBASALT=0"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
      "c 13:* rmw"
    ]
  }
}
"""

# ==============================================================================
# APPLICATION 2: HEROIC GAMES LAUNCHER (EPIC GAMES & GOG)
# ==============================================================================
# - Native headless launcher for Epic Games Store and GOG libraries.
# - Shared Games: Mounted READ-ONLY at /shared_games.
# - User Profile: Wolf's per-client home stays writable for installs, logins, and saves.
# ==============================================================================
[[apps]]
title = "Heroic Games Launcher (Epic & GOG)"
start_virtual_compositor = true

[apps.runner]
type = "docker"
name = "heroic-cloud"
image = "ghcr.io/games-on-whales/heroic-games-launcher:edge"
mounts = [
    # Wolf supplies a separate writable home directory for each paired client.
    # Shared Game Installations (READ-ONLY; Heroic's default path remains writable)
    "/home/vansh/Projects/Home_Cloud_Gaming/data/shared_games:/shared_games:ro"
]
env = [
    "XDG_RUNTIME_DIR=/tmp",
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
      "c 13:* rmw"
    ]
  }
}
"""
