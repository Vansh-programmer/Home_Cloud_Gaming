hostname = "Ryoku Cloud Gaming"
support_hevc = true

# ==============================================================================
# APPLICATION 1: STEAM CLOUD GAMING NODE
# ==============================================================================
# - Runs on headless virtual Sway/Gamescope compositor.
# - Shared Games: Mounted READ-ONLY (:ro) to eliminate duplication and prevent tampering.
# - User Profile: Mounted READ-WRITE (:rw) for isolated logins, saves, and prefixes.
# ==============================================================================
[[apps]]
title = "Steam Cloud Gaming"
start_virtual_compositor = true

[apps.runner]
type = "docker"
name = "steam-cloud"
image = "ghcr.io/games-on-whales/steam:edge"
mounts = [
    # 1. User Isolated Storage (Logins, Saves, Proton Prefixes)
    "ryoku-user-storage:/home/retro:rw",
    # 2. Shared Game Library (READ-ONLY: Zero duplication, zero modification by users)
    "/home/vansh/Projects/Home_Cloud_Gaming/data/shared_games:/home/retro/.local/share/Steam/steamapps/common:ro"
]
env = [
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*",
    "ENABLE_VKBASALT=0"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
      "c 13:* rmw"
    ]
  }
}
"""

# ==============================================================================
# APPLICATION 2: HEROIC GAMES LAUNCHER (EPIC GAMES & GOG)
# ==============================================================================
# - Native headless launcher for Epic Games Store and GOG libraries.
# - Shared Games: Mounted READ-ONLY (:ro) for shared games without duplication.
# - User Profile: Mounted READ-WRITE (:rw) for isolated Epic/GOG logins and saves.
# ==============================================================================
[[apps]]
title = "Heroic Games Launcher (Epic & GOG)"
start_virtual_compositor = true

[apps.runner]
type = "docker"
name = "heroic-cloud"
image = "ghcr.io/games-on-whales/heroic-games-launcher:edge"
mounts = [
    # 1. User Isolated Storage (Epic/GOG Logins, Heroic configs, Wine Prefixes, Saves)
    "ryoku-user-storage:/home/retro:rw",
    # 2. Shared Game Installations (READ-ONLY: Zero duplication, zero modification by users)
    "/home/vansh/Projects/Home_Cloud_Gaming/data/shared_games:/home/retro/Games:ro"
]
env = [
    "RUN_SWAY=1",
    "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*"
]
devices = []
ports = []

base_create_json = """
{
  "HostConfig": {
    "IpcMode": "shareable",
    "CapAdd": [
      "SYS_ADMIN",
      "SYS_PTRACE"
    ],
    "DeviceCgroupRules": [
      "c 13:* rmw"
    ]
  }
}
"""
