<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#172742"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steam-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#glow)"/>

  <!-- Subtle Steam Tech Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="2">
    <circle cx="580" cy="270" r="320" fill="none"/>
    <circle cx="580" cy="270" r="440" fill="none"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="580" y1="0" x2="580" y2="540"/>
  </g>

  <!-- Steam Piston / Crank Mechanism Logo -->
  <g transform="translate(620, 260) scale(1.35)">
    <!-- Big outer ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#steam-metal)" stroke-width="24"/>
    <circle cx="0" cy="0" r="42" fill="#172742"/>
    <circle cx="0" cy="0" r="28" fill="#38bdf8" opacity="0.85"/>

    <!-- Connecting Rod -->
    <path d="M 0 0 L -105 78 L -142 46 L -35 -26 Z" fill="url(#steam-metal)"/>

    <!-- Small Pivot 1 -->
    <circle cx="-120" cy="62" r="34" fill="none" stroke="url(#steam-metal)" stroke-width="16"/>
    <circle cx="-120" cy="62" r="16" fill="#0e1726"/>

    <!-- Small Connecting Rod 2 -->
    <path d="M -120 62 L -195 10 L -215 32 L -140 84 Z" fill="url(#steam-metal)" opacity="0.9"/>

    <!-- Small Pivot 2 -->
    <circle cx="-205" cy="21" r="24" fill="none" stroke="url(#steam-metal)" stroke-width="12"/>
    <circle cx="-205" cy="21" r="10" fill="#38bdf8"/>
  </g>

  <!-- Title & Badge Left/Bottom -->
  <g transform="translate(64, 450)">
    <text x="0" y="0" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1">STEAM</text>
    <text x="180" y="-3" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="4">BIG PICTURE</text>
  </g>
</svg>
