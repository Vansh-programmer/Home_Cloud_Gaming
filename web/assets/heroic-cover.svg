<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110724"/>
      <stop offset="50%" stop-color="#210d3d"/>
      <stop offset="100%" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="hglow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#110724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#hbg)"/>
  <circle cx="300" cy="360" r="280" fill="url(#hglow)"/>

  <!-- Top Badge -->
  <rect x="155" y="64" width="290" height="34" rx="17" fill="#1e1035" stroke="#a855f7" stroke-width="1.5"/>
  <text x="300" y="86" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2.5">EPIC GAMES &amp; GOG CLIENT</text>

  <!-- Heroic Shield / Wings Logo Motif -->
  <g transform="translate(300, 360)">
    <!-- Outer Shield Glow -->
    <path d="M 0 -130 L 110 -60 L 100 60 L 0 130 L -100 60 L -110 -60 Z" fill="#2d1254" fill-opacity="0.8" stroke="url(#shieldGrad)" stroke-width="8"/>
    
    <!-- Heroic H / Dual Wings Silhouette -->
    <path d="M -50 -70 L -25 -70 L -25 -10 L 25 -10 L 25 -70 L 50 -70 L 50 70 L 25 70 L 25 15 L -25 15 L -25 70 L -50 70 Z" fill="url(#epicGrad)"/>
    <polygon points="0,-100 35,-50 -35,-50" fill="#ec4899"/>
    <circle cx="0" cy="90" r="10" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="300" y="660" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="900" text-anchor="middle" letter-spacing="2">HEROIC</text>
  <text x="300" y="710" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="4">GAMES LAUNCHER</text>
  <text x="300" y="765" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">EPIC STORE • PROTON WINE • CLOUD SAVES</text>
</svg>

