<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="hbbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e061c"/>
      <stop offset="50%" stop-color="#1f0a38"/>
      <stop offset="100%" stop-color="#090312"/>
    </linearGradient>
    <radialGradient id="hbglow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e061c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hmetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#hbbg)"/>
  <rect width="960" height="540" fill="url(#hbglow)"/>

  <!-- Tech Grid Background Lines -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="2">
    <circle cx="620" cy="270" r="300" fill="none"/>
    <circle cx="620" cy="270" r="420" fill="none"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="620" y1="0" x2="620" y2="540"/>
  </g>

  <!-- Central Shield / Epic Emblem -->
  <g transform="translate(620, 260) scale(1.3)">
    <!-- Outer Shield -->
    <path d="M 0 -100 L 85 -45 L 75 45 L 0 100 L -75 45 L -85 -45 Z" fill="#2d1254" fill-opacity="0.75" stroke="url(#hmetal)" stroke-width="12"/>
    <!-- Core H Emblem -->
    <path d="M -35 -45 L -16 -45 L -16 -8 L 16 -8 L 16 -45 L 35 -45 L 35 45 L 16 45 L 16 10 L -16 10 L -16 45 L -35 45 Z" fill="#ffffff"/>
    <polygon points="0,-72 24,-36 -24,-36" fill="#ec4899"/>
  </g>

  <!-- Title & Badge Left/Bottom -->
  <g transform="translate(64, 450)">
    <text x="0" y="0" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1">HEROIC</text>
    <text x="200" y="-3" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="4">EPIC &amp; GOG</text>
  </g>
</svg>
