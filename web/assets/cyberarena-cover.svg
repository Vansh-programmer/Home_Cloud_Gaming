<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="50%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050b1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="270" fill="url(#glow)"/>
  <!-- Perspective Cyber Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="0" y1="620" x2="600" y2="620"/>
    <line x1="0" y1="660" x2="600" y2="660"/>
    <line x1="0" y1="710" x2="600" y2="710"/>
    <line x1="0" y1="770" x2="600" y2="770"/>
    <line x1="0" y1="840" x2="600" y2="840"/>
    <line x1="300" y1="540" x2="-100" y2="900"/>
    <line x1="300" y1="540" x2="50" y2="900"/>
    <line x1="300" y1="540" x2="200" y2="900"/>
    <line x1="300" y1="540" x2="300" y2="900"/>
    <line x1="300" y1="540" x2="400" y2="900"/>
    <line x1="300" y1="540" x2="550" y2="900"/>
    <line x1="300" y1="540" x2="700" y2="900"/>
  </g>
  <!-- 3D Neon Energy Crystal -->
  <g transform="translate(300, 350)">
    <polygon points="0,-150 115,-20 0,140 -115,-20" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-width="4"/>
    <polygon points="0,-150 115,-20 0,25" fill="#38bdf8" fill-opacity="0.35"/>
    <polygon points="0,-150 -115,-20 0,25" fill="#818cf8" fill-opacity="0.25"/>
    <polygon points="0,25 115,-20 0,140 -115,-20" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="0" cy="-15" r="16" fill="#f8fafc"/>
  </g>
  <!-- Badges & Typography -->
  <rect x="195" y="64" width="210" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="85" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">60 FPS OPENGL ARENA</text>
  <text x="300" y="675" fill="#f8fafc" font-family="sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="3">CYBERARENA</text>
  <text x="300" y="730" fill="url(#neon)" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="8">3D EDITION</text>
  <text x="300" y="785" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.5">RTX 4060 NVENC • SYNTH AUDIO • CLOUD SAVES</text>
</svg>

