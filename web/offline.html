<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ryoku_game // Host Offline</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --console-bg: #f8fafc;
      --console-surface: #ffffff;
      --fg-0: #0f172a;
      --fg-1: #475569;
      --fg-2: #94a3b8;
      --line: #e2e8f0;
      --line-focus: #cbd5e1;
      --brand-primary: #00d09c;
      --brand-hover: #00b686;
      --brand-light: #e6fbf5;
      --warn: #f59e0b;
      --warn-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-ui);
      background: var(--console-bg);
      color: var(--fg-0);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .offline-card {
      max-width: 500px;
      width: 100%;
      background: var(--console-surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand-emblem {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .app-logo-img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 208, 156, 0.25);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--fg-0);
    }

    .settings-btn {
      background: #f1f5f9;
      border: 1px solid var(--line);
      color: var(--fg-1);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .settings-btn:hover {
      background: #e2e8f0;
      color: var(--fg-0);
    }

    .status-badge-wrap {
      margin-bottom: 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: var(--warn-light);
      border: 1px solid #fde68a;
      color: #b45309;
      font-size: 12px;
      font-weight: 700;
      border-radius: 9999px;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .status-badge.booting {
      background: var(--brand-light);
      border-color: #a7f3d0;
      color: #047857;
    }

    .status-badge.booting .status-dot {
      background: var(--brand-primary);
    }

    .status-badge.online {
      background: var(--brand-light);
      border-color: #a7f3d0;
      color: #047857;
    }

    .status-badge.online .status-dot {
      background: var(--brand-primary);
      animation: none;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--fg-0);
      margin-bottom: 8px;
    }

    p.lead {
      color: var(--fg-1);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .specs-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .spec-item .label {
      display: block;
      color: var(--fg-2);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .spec-item .value {
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-0);
      font-family: var(--font-mono);
    }

    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    button.btn {
      cursor: pointer;
      width: 100%;
      padding: 14px 20px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s ease;
    }

    button.btn-primary {
      background: var(--brand-primary);
      color: #022c22;
      box-shadow: 0 4px 14px rgba(0, 208, 156, 0.3);
    }

    button.btn-primary:hover {
      background: var(--brand-hover);
      box-shadow: 0 6px 20px rgba(0, 208, 156, 0.4);
      transform: translateY(-1px);
    }

    button.btn-primary:active {
      transform: translateY(0);
    }

    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    button.btn-outline {
      background: #ffffff;
      border-color: var(--line);
      color: var(--fg-0);
    }

    button.btn-outline:hover {
      background: #f8fafc;
      border-color: var(--line-focus);
    }

    button.btn-danger-outline {
      background: #ffffff;
      border-color: #fecaca;
      color: var(--danger);
    }

    button.btn-danger-outline:hover {
      background: var(--danger-light);
      border-color: var(--danger);
    }

    .status-log {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-1);
      min-height: 42px;
      display: flex;
      align-items: center;
      word-break: break-all;
    }

    .status-log.highlight {
      color: #047857;
      background: var(--brand-light);
      border-color: #a7f3d0;
    }

    .status-log.error {
      color: var(--danger);
      background: var(--danger-light);
      border-color: #fecaca;
    }

    .config-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .config-panel.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .config-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-0);
      margin-bottom: 12px;
    }

    .config-field {
      margin-bottom: 12px;
    }

    .config-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-1);
      margin-bottom: 4px;
    }

    .config-field input {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg-0);
      padding: 9px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .config-field input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(0, 208, 156, 0.15);
    }

    .config-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .config-note {
      font-size: 11px;
      color: var(--fg-2);
      margin-top: 10px;
      line-height: 1.4;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(2, 44, 34, 0.2);
      border-top-color: #022c22;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="brand-header">
      <div class="brand-emblem">
        <img src="/assets/logo.jpg" alt="ryoku_game" class="app-logo-img" />
        <span class="brand-title">ryoku_game</span>
      </div>
      <button class="settings-btn" id="toggle-config-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Hardware Switch</span>
      </button>
    </div>

    <div class="status-badge-wrap">
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-badge-text">Host Offline</span>
      </div>
    </div>

    <h1 id="headline">Gaming PC is Currently Powered Off</h1>
    <p class="lead" id="subtext">Turn on the PC using the hardware switch to start playing.</p>

    <!-- Config Panel -->
    <div class="config-panel" id="config-panel">
      <div class="config-title">Switch Settings</div>
      <div class="config-field">
        <label for="cfg-bot-token">Telegram Bot Token</label>
        <input type="password" id="cfg-bot-token" placeholder="Bot Token" autocomplete="off" />
      </div>
      <div class="config-field">
        <label for="cfg-chat-id">Telegram Chat ID</label>
        <input type="text" id="cfg-chat-id" placeholder="Numeric Chat ID" autocomplete="off" />
      </div>
      <div class="config-actions">
        <button class="btn btn-primary" id="save-config-btn" type="button" style="padding: 10px 16px; font-size: 13px;">Save</button>
        <button class="btn btn-outline" id="test-pulse-btn" type="button" style="padding: 10px 16px; font-size: 13px;">Test</button>
      </div>
      <div class="config-note">
        Saved locally in browser storage.
      </div>
    </div>

    <div class="specs-box">
      <div class="spec-item">
        <span class="label">Hardware Switch</span>
        <span class="value" id="switch-status-label">ESP8266</span>
      </div>
      <div class="spec-item">
        <span class="label">Poll Interval</span>
        <span class="value" id="poll-counter">5s</span>
      </div>
    </div>

    <div class="actions-grid">
      <button class="btn btn-primary" id="power-on-btn" type="button">
        <span id="power-btn-spinner" style="display:none;" class="spinner"></span>
        <svg id="power-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span id="power-btn-text">Turn On PC</span>
      </button>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn btn-outline" id="check-now-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span>Ping Host</span>
        </button>
        <button class="btn btn-danger-outline" id="force-off-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Force Off</span>
        </button>
      </div>
    </div>

    <div class="status-log" id="last-checked">Ready</div>
  </main>

  <script>
    (function () {
      const STORAGE_KEY_TOKEN = "ryoku_esp_bot_token";
      const STORAGE_KEY_CHAT  = "ryoku_esp_chat_id";

      const badge = document.getElementById("status-badge");
      const badgeText = document.getElementById("status-badge-text");
      const headline = document.getElementById("headline");
      const subtext = document.getElementById("subtext");
      const lastChecked = document.getElementById("last-checked");
      const checkBtn = document.getElementById("check-now-btn");
      const powerBtn = document.getElementById("power-on-btn");
      const powerBtnText = document.getElementById("power-btn-text");
      const powerBtnSpinner = document.getElementById("power-btn-spinner");
      const powerBtnIcon = document.getElementById("power-btn-icon");
      const forceOffBtn = document.getElementById("force-off-btn");
      const toggleConfigBtn = document.getElementById("toggle-config-btn");
      const configPanel = document.getElementById("config-panel");
      const cfgBotToken = document.getElementById("cfg-bot-token");
      const cfgChatId = document.getElementById("cfg-chat-id");
      const saveConfigBtn = document.getElementById("save-config-btn");
      const testPulseBtn = document.getElementById("test-pulse-btn");
      const pollCounter = document.getElementById("poll-counter");

      let pollTimer = null;
      let currentIntervalMs = 5000;
      let isBooting = false;
      let bootStartTimestamp = 0;

      const basePrefix = window.location.pathname.startsWith("/cloudgaming") ? "/cloudgaming" : "";

      function loadSettings() {
        const savedToken = localStorage.getItem(STORAGE_KEY_TOKEN) || "";
        const savedChat = localStorage.getItem(STORAGE_KEY_CHAT) || "";
        if (savedToken) cfgBotToken.value = savedToken;
        if (savedChat) cfgChatId.value = savedChat;
        return { token: savedToken, chatId: savedChat };
      }

      function saveSettings() {
        const token = cfgBotToken.value.trim();
        const chatId = cfgChatId.value.trim();
        if (!token || !chatId) {
          logMessage("Please enter Bot Token and Chat ID.", "error");
          return false;
        }
        localStorage.setItem(STORAGE_KEY_TOKEN, token);
        localStorage.setItem(STORAGE_KEY_CHAT, chatId);
        logMessage("Settings saved successfully.", "highlight");
        configPanel.classList.remove("open");
        return true;
      }

      function logMessage(msg, type) {
        lastChecked.textContent = msg;
        lastChecked.className = "status-log" + (type === "highlight" ? " highlight" : type === "error" ? " error" : "");
      }

      async function checkHealth() {
        try {
          const res = await fetch(basePrefix + "/api/health", { cache: "no-store" });
          const data = await res.json();
          if (res.ok && data && data.online === true) {
            badge.className = "status-badge online";
            badgeText.textContent = "Host Online";
            headline.textContent = "Host Online";
            subtext.textContent = "PC is online. Redirecting...";
            logMessage("Host is online. Connecting...", "highlight");
            clearInterval(pollTimer);
            setTimeout(() => {
              window.location.href = basePrefix || "/";
            }, 500);
            return;
          }
        } catch (_err) {
          // PC offline
        }

        const now = new Date().toLocaleTimeString();
        if (isBooting) {
          const elapsedSec = Math.floor((Date.now() - bootStartTimestamp) / 1000);
          logMessage("Booting PC (" + elapsedSec + "s)... Checked at " + now);
        } else {
          logMessage("Checked at " + now + " - Host offline");
        }
      }

      function setPollRate(ms) {
        currentIntervalMs = ms;
        pollCounter.textContent = Math.round(ms / 1000) + "s";
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(checkHealth, ms);
      }

      async function sendTelegramCommand(commandText, userFeedback) {
        const { token, chatId } = loadSettings();
        if (!token || !chatId) {
          configPanel.classList.add("open");
          logMessage("Configure Bot Token and Chat ID first.", "error");
          return false;
        }

        logMessage("Sending command to switch...", "highlight");

        try {
          let delivered = false;

          try {
            const edgeRes = await fetch(basePrefix + "/api/power_on", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, chat_id: chatId, command: commandText })
            });
            if (edgeRes.ok) delivered = true;
          } catch (_edgeErr) {}

          if (!delivered) {
            const tgUrl = "https://api.telegram.org/bot" + encodeURIComponent(token) + "/sendMessage?chat_id=" + encodeURIComponent(chatId) + "&text=" + encodeURIComponent(commandText);
            await fetch(tgUrl, { mode: "no-cors" });
          }

          logMessage(userFeedback, "highlight");
          return true;
        } catch (err) {
          logMessage("Error sending command: " + err.message, "error");
          return false;
        }
      }

      toggleConfigBtn.addEventListener("click", () => {
        configPanel.classList.toggle("open");
      });

      saveConfigBtn.addEventListener("click", () => {
        saveSettings();
      });

      testPulseBtn.addEventListener("click", async () => {
        if (!saveSettings()) return;
        await sendTelegramCommand("/status", "Status signal sent.");
      });

      powerBtn.addEventListener("click", async () => {
        const { token, chatId } = loadSettings();
        if (!token || !chatId) {
          configPanel.classList.add("open");
          logMessage("Configure Bot Token and Chat ID first.", "error");
          return;
        }

        powerBtn.disabled = true;
        powerBtnSpinner.style.display = "inline-block";
        if (powerBtnIcon) powerBtnIcon.style.display = "none";
        powerBtnText.textContent = "Signaling...";

        const success = await sendTelegramCommand(
          "/power",
          "Power signal sent. Powering on..."
        );

        if (success) {
          isBooting = true;
          bootStartTimestamp = Date.now();
          badge.className = "status-badge booting";
          badgeText.textContent = "Boot Signal Sent";
          headline.textContent = "Powering Up PC...";
          subtext.textContent = "Hardware switch triggered. Connecting automatically...";
          setPollRate(2000);
        }

        setTimeout(() => {
          powerBtn.disabled = false;
          powerBtnSpinner.style.display = "none";
          if (powerBtnIcon) powerBtnIcon.style.display = "inline-block";
          powerBtnText.textContent = "Turn On PC";
        }, 6000);
      });

      forceOffBtn.addEventListener("click", async () => {
        const confirmed = confirm(
          "Force power-off: This simulates holding the power button for 5 seconds. Continue?"
        );
        if (!confirmed) return;

        await sendTelegramCommand(
          "/force_off",
          "Force power-off signal sent."
        );
      });

      checkBtn.addEventListener("click", () => {
        logMessage("Pinging host...");
        checkHealth();
      });

      loadSettings();
      setPollRate(5000);
      checkHealth();
    })();
  </script>
</body>
</html>
