<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYOKU // HOST OFFLINE</title>
  <style>
    :root {
      --bg-base: #090a0d;
      --bg-panel: #111318;
      --bg-input: #0c0e12;
      --border-dim: #222631;
      --accent: #c8ff00;
      --warn: #ffb800;
      --ok: #00e676;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-top: 3px solid var(--warn);
      padding: 28px;
    }
    .brand-row {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: var(--bg-input);
      border: 1px solid var(--warn);
      color: var(--warn);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--warn);
    }
    .status-badge.online {
      border-color: var(--ok);
      color: var(--ok);
    }
    .status-badge.online .status-dot {
      background: var(--ok);
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p.lead {
      color: var(--text-sub);
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 20px;
    }
    .specs-box {
      background: var(--bg-input);
      border: 1px solid var(--border-dim);
      padding: 14px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .spec-item span.label {
      display: block;
      color: var(--text-sub);
      font-size: 10px;
      margin-bottom: 2px;
    }
    .spec-item span.value {
      font-weight: 700;
      color: var(--text-main);
    }
    button.btn {
      cursor: pointer;
      width: 100%;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #000;
      border-radius: 0;
    }
    .poll-note {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="brand-row">RYOKU // CLOUD CLIENT</div>
    <div>
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-badge-text">HOST NODE OFFLINE</span>
      </div>
    </div>
    <h1 id="headline">Gaming PC is Currently Powered Off</h1>
    <p class="lead" id="subtext">AUTO-CONNECTS WHEN HOST BOOTS.</p>

    <div class="specs-box">
      <div class="spec-item">
        <span class="label">GPU</span>
        <span class="value">RTX 4060 NVENC</span>
      </div>
      <div class="spec-item">
        <span class="label">POLL INTERVAL</span>
        <span class="value" id="poll-counter">5 SECONDS</span>
      </div>
    </div>

    <button class="btn" id="check-now-btn" type="button">PING HOST NOW</button>
    <div class="poll-note" id="last-checked">WAITING FOR HEARTBEAT...</div>
  </main>

  <script>
    (function () {
      const badge = document.getElementById("status-badge");
      const badgeText = document.getElementById("status-badge-text");
      const headline = document.getElementById("headline");
      const subtext = document.getElementById("subtext");
      const lastChecked = document.getElementById("last-checked");
      const checkBtn = document.getElementById("check-now-btn");

      async function checkHealth() {
        lastChecked.textContent = "PINGING HOST...";
        try {
          const res = await fetch("/api/health", { cache: "no-store" });
          const data = await res.json();
          if (res.ok && data && data.online === true) {
            badge.classList.add("online");
            badgeText.textContent = "HOST ONLINE";
            headline.textContent = "HOST NODE ONLINE";
            subtext.textContent = "REDIRECTING...";
            setTimeout(() => {
              window.location.href = "/";
            }, 400);
            return;
          }
          lastChecked.textContent = "CHECKED " + new Date().toLocaleTimeString() + " // OFFLINE";
        } catch (_err) {
          lastChecked.textContent = "CHECKED " + new Date().toLocaleTimeString() + " // UNREACHABLE";
        }
      }

      checkBtn.addEventListener("click", checkHealth);
      setInterval(checkHealth, 5000);
      checkHealth();
    })();
  </script>
</body>
</html>
