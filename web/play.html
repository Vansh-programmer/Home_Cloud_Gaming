<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <title>Ryoku | Cloud Gaming</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #08090a; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="stream-frame" src="/stream" title="Ryoku game stream"
    allow="gamepad; fullscreen; microphone; autoplay; clipboard-write; clipboard-read"
    allowfullscreen></iframe>
  <script src="/portal-assets/stream-branding.js?v=8"></script>
  <script>
    try {
      if (!sessionStorage.getItem('ryoku-launch-app')) {
        sessionStorage.setItem('ryoku-launch-app', localStorage.getItem('ryoku-last-app') || 'Steam');
      }
    } catch (_e) {}
    const frame = document.getElementById('stream-frame');
    const applyBranding = () => window.applyRyokuStreamBranding(frame);
    frame.addEventListener('load', applyBranding);
    if (frame.contentDocument?.readyState === 'complete') applyBranding();
    const sessionHeartbeat = window.setInterval(async () => {
      try {
        const response = await fetch('/api/session/heartbeat', {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (!response.ok) {
          sessionEnded = true;
          window.clearInterval(sessionHeartbeat);
          frame.src = 'about:blank';
          document.title = 'Ryoku | Session ended';
        }
      } catch (_error) {
        // Keep the stream open during a brief network interruption.
      }
    }, 20000);
    let sessionEnded = false;
    window.addEventListener('pagehide', () => {
      if (!sessionEnded) {
        fetch('/api/session/release', { method: 'POST', credentials: 'same-origin', keepalive: true }).catch(() => {});
      }
    });
  </script>
</body>
</html>
